<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Inter Doubt — Settings</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1e293b;
    background: #f8fafc;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e2e8f0; background: #0f172a; }
    input, select { background: #1e293b !important; color: #e2e8f0 !important; border-color: #334155 !important; }
  }
  h1 { font-size: 18px; }
  label { display: block; margin-top: 16px; font-size: 13px; font-weight: 600; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    box-sizing: border-box;
  }
  button {
    margin-top: 20px;
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background: #2dd4bf;
    color: #0f172a;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #14b8a6; }
  p.hint { font-size: 12px; color: #64748b; margin-top: 6px; }
  #status { margin-top: 12px; font-size: 13px; }
</style>
</head>
<body>
  <h1>Inter Doubt — Side Agent settings</h1>
  <p class="hint">
    This extension calls the Anthropic API directly from your browser, so it
    needs your own API key. The key is stored only in this browser's local
    extension storage and is never sent anywhere except api.anthropic.com.
  </p>

  <label for="apiKey">Anthropic API key</label>
  <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" />

  <label for="model">Model</label>
  <select id="model">
    <option value="claude-sonnet-5">claude-sonnet-5</option>
    <option value="claude-opus-5">claude-opus-5</option>
    <option value="claude-haiku-4-5-20251001">claude-haiku-4-5-20251001</option>
  </select>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
